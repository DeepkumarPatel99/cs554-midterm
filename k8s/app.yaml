apiVersion: apps/v1
kind: Deployment
metadata:
  name: midterm-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: midterm-app
  template:
    metadata:
      labels:
        app: midterm-app
    spec:
      containers:
        - name: app
          image: cs554-midterm:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "cs554-midterm"
            - name: MESSAGE
              value: "Hello from Deepkumar's Kubernetes cluster"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: midterm-service
spec:
  selector:
    app: midterm-app
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP

